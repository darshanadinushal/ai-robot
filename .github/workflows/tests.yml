name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Voice packages are optional at runtime, so tests only need pygame.
      - run: python -m pip install "pygame>=2.6,<3"
      - run: python -m unittest discover -s tests -v
