name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # Like the Raspberry Pi 5: 64-bit ARM Linux with Python 3.11 (Raspberry Pi OS Bookworm).
          - os: ubuntu-24.04-arm
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      LUNA_LOG_FILE: "off"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Voice, speech and AI packages are optional at runtime, so tests only need pygame.
      - run: python -m pip install "pygame>=2.6,<3"
      - run: python -m unittest discover -s tests -v

  agents:
    # The task service with the OpenAI Agents SDK (the [agents] extra): scripted models only,
    # never the real API. ARM Linux + Python 3.11 is the Raspberry Pi 5.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      LUNA_LOG_FILE: "off"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pygame>=2.6,<3" "openai-agents>=0.24,<0.25"
      - run: python -m unittest discover -s tests -p "test_agents.py" -v
      - run: python -m unittest discover -s tests -p "test_tasks.py" -v

  install:
    # A clean installation (wheel + example plugin in a new venv) and upgrade/rollback scripts.
    runs-on: ubuntu-latest
    env:
      LUNA_SLOW_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # pygame for the upgrade/rollback test (the clean install uses its own venv).
      - run: python -m pip install "pygame>=2.6,<3"
      - run: python -m unittest discover -s tests -p test_install.py -v
