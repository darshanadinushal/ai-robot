[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-pantry"
version = "1.0.0"
description = "Example Luna Core plugin: a background helper (specialist) with its own tool"
requires-python = ">=3.11"
dependencies = ["luna-core>=1.1,<2"]

# Installed plugins start switched off; the user turns this one on and allows "agents" in
# Settings > Plugins. Its helper works when background tasks are on (LUNA_TASKS=service).
[project.entry-points."luna.plugins"]
pantry = "luna_pantry:PantryPlugin"
