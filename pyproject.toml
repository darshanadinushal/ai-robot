[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-core"
dynamic = ["version"]
description = "Luna Core: a talking robot face for Raspberry Pi 5 and desktop (offline voice, optional AI chat)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Raspberry Pi OS uses apt's python3-pygame (venv with --system-site-packages), hence the low minimum.
dependencies = ["pygame>=2.1,<3"]

[project.optional-dependencies]
voice = ["vosk>=0.3.45", "sounddevice>=0.4.6"]
speech = ["piper-tts==1.8.0", "onnxruntime==1.31.0"]
ai = ["openai>=1.40"]
all = ["luna-core[voice,speech,ai]"]

[project.scripts]
luna = "luna_core.cli:main"

[tool.setuptools.dynamic]
version = { attr = "luna_core.__version__" }

[tool.setuptools.packages.find]
include = ["luna_core*", "robot_hud*"]

[tool.setuptools.package-data]
luna_core = ["voices.json", "languages/*.json"]
